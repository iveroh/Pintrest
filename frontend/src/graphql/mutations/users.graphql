mutation CreateUser($userData: CreateUserInput!) {
    createUser(userData: $userData) {
      token
      user {
      id
      username
      email
      display_name
      bio
      avatar_path
      avatar_public_id
      banner_path
      banner_public_id
    }
  }
}

mutation Login($username: String!, $password: String!) {
  login(username: $username, password: $password) {
    token
    user {
      username
      email
      display_name
      avatar_path
    }
  }
}

mutation UpdateUserProfile($userId: ID!, $profileData: UpdateUserProfileInput!) {
  updateUserProfile(userId: $userId, profileData: $profileData) {
    username
    email
    display_name
    bio
    avatar_path
    avatar_public_id
    banner_path
    banner_public_id
  }
}